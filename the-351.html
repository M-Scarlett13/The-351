<meta property="og:title" content="The 351 — Massachusetts, town by town">
<meta property="og:description" content="A daily 4-round quiz for the Commonwealth. New rounds every midnight.">
<meta name="description" content="A daily 4-round quiz for the Commonwealth. New rounds every midnight.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1622; --panel:#101f2e; --panel2:#152636;
    --land:#182b3d; --edge:#274158;
    --lit:#ffb53e; --lit-bright:#ffe08a; --miss:#c9564f;
    --target:#5ec8ff; --target-bright:#bfe8ff;
    --text:#e9eff5; --sub:#8aa0b4; --good:#7fd4a3;
    --shield:#f5efe2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Barlow',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh;
  }
  .wrap{width:100%; max-width:760px; padding:14px 14px 40px; display:flex; flex-direction:column; gap:12px;}

  header{display:flex; align-items:baseline; justify-content:space-between; padding:2px 2px 0;}
  .brand{font-family:'Barlow Condensed'; font-weight:700; font-size:22px; letter-spacing:.06em; text-transform:uppercase;}
  .brand span{color:var(--lit);}
  .daytag{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--sub); text-align:right;}
  .daytag b{color:var(--target-bright); font-weight:600;}

  .banner{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    background:linear-gradient(90deg,#1b2f22,#152636); border:1px solid #2f5c3d; border-radius:10px;
    padding:10px 12px; font-size:13px;
  }
  .banner.show{display:flex;}
  .banner button{background:var(--good); color:#0c1f14; padding:8px 12px; font-size:13px; border-radius:8px;}

  .roundnav{display:flex; gap:8px;}
  .rn-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px; border-radius:10px; background:var(--panel2); border:1px solid #223650;
    font-family:'Barlow Condensed'; font-size:11px; letter-spacing:.04em; text-transform:uppercase; color:var(--sub);
  }
  .rn-item .ic{font-size:18px; line-height:1;}
  .rn-item.active{border-color:var(--lit); color:var(--lit-bright); background:#1d2a1a10;}
  .rn-item.done{color:var(--good); border-color:#2f5c46;}
  .rn-item .pts{font-family:'IBM Plex Mono',monospace; font-size:10px; color:inherit; opacity:.85;}

  .mapbox{position:relative; background:linear-gradient(180deg,#0d1a28,#0a141f); border:1px solid #1d3247; border-radius:14px; overflow:hidden;}
  svg{display:block; width:100%; height:auto;}
  .town{fill:var(--land); stroke:#233a50; stroke-width:.7; transition:fill .35s ease;}
  .town.lit{fill:var(--lit); stroke:#5c3f10; animation:pop .5s ease;}
  .town.fresh{fill:var(--lit-bright);}
  .town.missed{fill:#3a2028; stroke:var(--miss); stroke-width:.9;}
  .town.target{fill:var(--target); stroke:#0d3a57; stroke-width:1.1; animation:pulse 1.6s ease-in-out infinite;}
  .town.target.revealed{fill:var(--target-bright); animation:none;}
  @keyframes pop{0%{fill:#fff;}100%{fill:var(--lit);}}
  @keyframes pulse{0%,100%{fill-opacity:1;}50%{fill-opacity:.55;}}
  @media (prefers-reduced-motion:reduce){.town{transition:none;} .town.lit{animation:none;} .town.target{animation:none;}}
  .maplabel{
    position:absolute; left:12px; bottom:10px; font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--sub); pointer-events:none; max-width:70%;
  }
  .maplabel b{color:var(--lit-bright); font-weight:600;}
  .distline{stroke:var(--target-bright); stroke-width:2; stroke-dasharray:6 5; fill:none; opacity:.85;}
  .town.lit, .town.missed, .town.target{cursor:pointer;}

  .triviacard{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:28px 22px; gap:14px;
    background:rgba(11,22,34,0.88); backdrop-filter:blur(2px);
  }
  .triviacard.hidden{display:none;}
  .tc-eyebrow{font-family:'Barlow Condensed'; font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:13px; color:var(--target-bright);}
  .tc-clue{font-family:'Barlow Condensed'; font-weight:700; font-size:26px; line-height:1.35; max-width:580px; color:#fff;}
  svg.hidden{display:none;}

  .card{background:var(--panel); border:1px solid #24384d; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:12px;}
  .card h2{font-family:'Barlow Condensed'; font-weight:700; font-size:21px; letter-spacing:.03em;}
  .card .desc{font-size:14px; color:var(--sub); line-height:1.4;}
  .bigbtn{background:var(--lit); color:#241500; padding:14px; font-size:17px; border-radius:10px;}

  .bar{display:flex; gap:10px; align-items:stretch;}
  .shield{
    flex:0 0 64px; min-height:64px; border-radius:10px;
    background:var(--shield); color:#101820;
    display:flex; align-items:center; justify-content:center;
    font-family:'Barlow Condensed'; font-weight:700; font-size:38px;
    border:3px solid #101820; box-shadow:0 0 0 2px var(--shield);
  }
  .roundinfo{flex:1; display:flex; flex-direction:column; justify-content:center; gap:3px; min-width:0;}
  .roundinfo .big{font-family:'Barlow Condensed'; font-weight:600; font-size:19px; letter-spacing:.02em;}
  .roundinfo .small{font-size:13px; color:var(--sub);}
  .clock{
    flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; justify-content:center;
    font-family:'IBM Plex Mono',monospace;
  }
  .clock .t{font-size:26px; font-weight:600;}
  .clock .t.low{color:var(--miss);}
  .clock .s{font-size:12px; color:var(--sub);}

  .inputrow{display:flex; gap:8px;}
  input[type=text], input[type=number]{
    flex:1; background:var(--panel2); border:1px solid #2b4560; border-radius:10px;
    padding:14px 14px; font-size:17px; color:var(--text); font-family:'Barlow';
    outline:none; min-width:0;
  }
  input[type=text]:focus, input[type=number]:focus{border-color:var(--lit);}
  input.shake{animation:shake .3s;}
  @keyframes shake{25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  button{
    font-family:'Barlow Condensed'; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    border:none; border-radius:10px; cursor:pointer; font-size:16px;
  }
  .go{background:var(--lit); color:#241500; padding:0 22px;}
  .go:active{transform:scale(.97);}
  .feedback{min-height:18px; font-size:14px; color:var(--sub); padding:0 2px;}
  .feedback.good{color:var(--good);}
  .feedback.bad{color:#e08a84;}

  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{font-size:13px; padding:5px 10px; border-radius:999px; background:var(--panel2); border:1px solid #2b4560; color:var(--text);}

  .attempts{font-size:13px; color:var(--sub);}
  .quit{background:none; border:1px solid #2b4560; color:var(--sub); padding:10px 14px; font-size:14px; align-self:flex-start;}

  .resultline{display:flex; align-items:center; gap:10px; font-size:15px;}
  .resultline .em{font-size:22px;}
  .resultline .pts{margin-left:auto; font-family:'IBM Plex Mono',monospace; color:var(--target-bright); font-weight:600;}
  .answerbox{background:var(--panel2); border:1px solid #2b4560; border-radius:10px; padding:10px 12px; font-size:14px;}
  .answerbox b{color:var(--lit-bright);}

  .summary h3{font-family:'Barlow Condensed'; font-weight:700; font-size:26px; letter-spacing:.03em;}
  .summary .total{font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--target-bright); margin-top:2px;}
  .streak{font-size:13px; color:var(--sub);}
  .sharebtn{background:none; border:1px solid var(--lit); color:var(--lit); padding:12px; font-size:17px; border-radius:10px;}
  .sharebtn:active{background:rgba(255,181,62,.12);}

  .choices{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .choice{
    background:var(--panel2); border:1px solid #2b4560; color:var(--text);
    padding:14px 8px; font-family:'Barlow'; font-weight:500; font-size:15px;
    text-transform:none; letter-spacing:0; border-radius:10px; min-height:52px;
    line-height:1.2; word-break:break-word;
  }
  .choice:active{border-color:var(--lit);}
  .choice.wrong{background:#241a1f; border-color:var(--miss); color:#8b6f72; text-decoration:line-through; opacity:.7;}
  .choice:disabled{cursor:default;}

  .backdrop{
    position:fixed; inset:0; background:rgba(4,10,16,.78); backdrop-filter:blur(3px);
    display:flex; align-items:center; justify-content:center; padding:18px; z-index:50;
  }
  .backdrop.hidden{display:none !important;}
  .sheet{
    width:100%; max-width:420px; background:var(--panel);
    border:1px solid #2a415a; border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px;
    max-height:88dvh; overflow-y:auto;
  }
  .sheet h3{font-family:'Barlow Condensed'; font-weight:700; font-size:23px; letter-spacing:.03em;}
  .scorecard{
    background:#0c1826; border:1px solid #24384d; border-radius:10px; padding:12px;
    font-family:'IBM Plex Mono',monospace; font-size:13px; line-height:1.65; white-space:pre-wrap; color:var(--text);
  }
  .sheetbtns{display:flex; flex-direction:column; gap:8px;}
  .sheetbtn{padding:13px; font-size:16px; border-radius:10px; text-align:center; text-decoration:none; display:block;}
  .sheetbtn.primary{background:var(--lit); color:#241500;}
  .sheetbtn.ghost{background:var(--panel2); border:1px solid #2b4560; color:var(--text);}
  .closex{background:none; border:none; color:var(--sub); font-size:14px; padding:6px; text-transform:none; letter-spacing:0;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">The <span>351</span></div>
    <div class="daytag" id="daytag"></div>
  </header>

  <div class="banner" id="banner">
    <span>A new day's rounds are ready.</span>
    <button id="bannerbtn">Refresh</button>
  </div>

  <div class="roundnav" id="roundnav"></div>

  <div class="mapbox">
    <svg id="map" viewBox="0 0 1000 623" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="triviacard hidden" id="triviacard">
      <div class="tc-eyebrow" id="tc-eyebrow">TIME MACHINE</div>
      <div class="tc-clue" id="tc-clue"></div>
    </div>
    <div class="maplabel" id="maplabel"></div>
  </div>

  <div id="panel"></div>
</div>

<div class="backdrop hidden" id="sharemodal">
  <div class="sheet">
    <h3>Share your score</h3>
    <div class="scorecard" id="scorecard"></div>
    <div class="sheetbtns">
      <a class="sheetbtn primary" id="smsbtn" href="#">Text it to someone</a>
      <button class="sheetbtn ghost" id="copybtn">Copy score + link</button>
      <button class="sheetbtn ghost hidden" id="nativebtn">More sharing options</button>
    </div>
    <button class="closex" id="closeshare">Close</button>
  </div>

<script>
/* ---------- basic helpers ---------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function localDateKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function localMidnight(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---------- storage (works published-in-Claude, self-hosted, or in-memory fallback) ---------- */
const MEM = {};
const Store = {
  async get(key){
    if (window.storage){
      try { const r = await window.storage.get(key); return r ? JSON.parse(r.value) : null; } catch(e){ return null; }
    }
    try { const v = localStorage.getItem('the351:' + key); return v ? JSON.parse(v) : null; } catch(e){ return MEM[key] ?? null; }
  },
  async set(key, val){
    MEM[key] = val;
    if (window.storage){ try { await window.storage.set(key, JSON.stringify(val)); return; } catch(e){} }
    try { localStorage.setItem('the351:' + key, JSON.stringify(val)); } catch(e){}
  }
};

/* ---------- town lookup ---------- */
const ALL = Object.keys(DATA.shapes);
function norm(s){
  let t = s.toLowerCase().replace(/[^a-z]/g, '');
  t = t.replace(/borough/g, 'boro');
  if (t.startsWith('mt')) t = 'mount' + t.slice(2);
  if (t === 'manchester') t = 'manchesterbythesea';
  return t;
}
const LOOKUP = {};
ALL.forEach(n => { LOOKUP[norm(n)] = n; });
const byLetter = {};
ALL.forEach(n => { const L = n[0]; (byLetter[L] = byLetter[L] || []).push(n); });
const GOOD_LETTERS = Object.keys(byLetter).filter(L => byLetter[L].length >= 6);

const dateLabel = (() => {
  const d = new Date();
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
})();
const today0 = localMidnight(new Date());
const todayKey = localDateKey(new Date());
const EPOCH = localMidnight(new Date(2026, 6, 27)); // launch day = Day 1
const dayNum = Math.max(1, Math.round((today0 - EPOCH) / 86400000) + 1);

const rng = mulberry32(hashStr(todayKey));
const puzzle = (() => {
  const letter = GOOD_LETTERS[Math.floor(rng() * GOOD_LETTERS.length)];
  const town2 = ALL[Math.floor(rng() * ALL.length)];
  const triviaIdx = ((dayNum - 1) % TRIVIA.length + TRIVIA.length) % TRIVIA.length;
  const distMode = rng() < 0.5 ? 'between' : 'perimeter';
  let townA = ALL[Math.floor(rng() * ALL.length)];
  let townB = ALL[Math.floor(rng() * ALL.length)];
  while (townB === townA) townB = ALL[Math.floor(rng() * ALL.length)];
  const perimTown = ALL[Math.floor(rng() * ALL.length)];
  return { letter, town2, triviaIdx, distMode, townA, townB, perimTown };
})();

function haversineMiles(a, b){
  const R = 3958.7613;
  const [lon1, lat1] = DATA.latlon[a], [lon2, lat2] = DATA.latlon[b];
  const p1 = lat1 * Math.PI/180, p2 = lat2 * Math.PI/180;
  const dphi = (lat2-lat1) * Math.PI/180, dlmb = (lon2-lon1) * Math.PI/180;
  const h = Math.sin(dphi/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dlmb/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

const distAnswer = puzzle.distMode === 'between'
  ? haversineMiles(puzzle.townA, puzzle.townB)
  : DATA.perim[puzzle.perimTown];

/* ---------- Round 2 multiple choice: 7 regional decoys + the answer ---------- */
function nearestTowns(name, k){
  const [lon0, lat0] = DATA.latlon[name];
  const kx = Math.cos(lat0 * Math.PI / 180);
  return ALL
    .filter(n => n !== name)
    .map(n => {
      const [lon, lat] = DATA.latlon[n];
      const dx = (lon - lon0) * kx, dy = lat - lat0;
      return { n, d: dx * dx + dy * dy };
    })
    .sort((a, b) => a.d - b.d)
    .slice(0, k)
    .map(o => o.n);
}
const r2Options = (() => {
  const r = mulberry32(hashStr(todayKey + ':r2opts'));
  // pool of nearby towns so every option is plausibly in the same corner of the state
  const pool = nearestTowns(puzzle.town2, 26);
  const picked = [];
  const avail = pool.slice();
  while (picked.length < 7 && avail.length){
    picked.push(avail.splice(Math.floor(r() * avail.length), 1)[0]);
  }
  const opts = picked.concat([puzzle.town2]);
  for (let i = opts.length - 1; i > 0; i--){
    const j = Math.floor(r() * (i + 1));
    const t = opts[i]; opts[i] = opts[j]; opts[j] = t;
  }
  return opts;
})();

function calloutNode(name, opts){
  const c = DATA.centroids[name];

  dot.setAttribute('cx', c[0]); dot.setAttribute('cy', c[1]); dot.setAttribute('r', 5);

  t.setAttribute('text-anchor', 'middle');
  t.textContent = name;
  return [dot, t];
}
function showCallout(name){

/* ---------- scoring tiers ---------- */
function yearTier(guess, actual){
  const diff = Math.abs(guess - actual);
  if (diff === 0) return { label: 'Bullseye', pts: 100, em: '\u{1F3AF}' };
  if (diff <= 2) return { label: 'So close', pts: 70, em: '\u{1F525}' };
  if (diff <= 5) return { label: 'In the ballpark', pts: 40, em: '\u{1F44D}' };
  if (diff <= 15) return { label: 'Getting warmer', pts: 15, em: '\u{1F321}\uFE0F' };
  return { label: 'Way off', pts: 0, em: '\u{1F4A4}' };
}
function distTier(guess, actual){
  const pct = Math.abs(guess - actual) / actual;
  if (pct <= 0.03) return { label: 'Bullseye', pts: 100, em: '\u{1F3AF}' };
  if (pct <= 0.10) return { label: 'So close', pts: 70, em: '\u{1F525}' };
  if (pct <= 0.25) return { label: 'In the ballpark', pts: 40, em: '\u{1F44D}' };
  if (pct <= 0.50) return { label: 'Getting warmer', pts: 15, em: '\u{1F321}\uFE0F' };

}

        '<div class="shield">' + L + '</div>' +
        '<div class="roundinfo"><div class="big">Towns starting with ' + L + '</div>' +
        '<div class="small" id="scoreline">' + progress.r1.found.length + ' / ' + total + '</div></div>' +
        '<div class="clock"><div class="t' + (remaining <= 10 ? ' low' : '') + '" id="timer">' + remaining + '</div><div class="s">seconds</div></div>' +
      '</div>' +
      '<div class="inputrow"><input type="text" id="guess" placeholder="Type a town\u2026" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false"><button class="go" data-action="r1submit">Guess</button></div>' +
      '<div class="feedback" id="feedback"></div>' +
      '<div class="chips" id="chips">' + progress.r1.found.slice().reverse().map(n => '<span class="chip">' + escapeHtml(n) + '</span>').join('') + '</div>' +
      '<button class="quit" data-action="r1end">Done for now</button>';
    $('guess').focus();
    startR1TimerLoop();
    return;
  }
  // done
  const missed = byLetter[L].filter(n => !progress.r1.found.includes(n));
  $('panel').innerHTML =
    '<div class="card">' +
      '<h2>' + progress.r1.found.length + ' of ' + total + '</h2>' +
      '<div class="desc">' + progress.r1.pts + ' points. Tap any town on the map to see its name; missed ones are outlined in red.</div>' +
      '<button class="bigbtn" data-action="goto-r2">Continue to Round 2</button>' +
    '</div>';
}
function startR1TimerLoop(){
  if (r1timer) clearInterval(r1timer);
  r1timer = setInterval(() => {
    if (phase !== 'r1' || r1sub !== 'active'){ clearInterval(r1timer); return; }
    const remaining = Math.max(0, Math.ceil((progress.r1.endsAt - Date.now()) / 1000));
    const t = $('timer');
    if (t){ t.textContent = remaining; t.classList.toggle('low', remaining <= 10); }
    if (remaining <= 0){ clearInterval(r1timer); endR1(); }
  }, 250);
}
async function r1Start(){
  progress.r1.endsAt = Date.now() + 45000;
  r1sub = 'active';
  await Store.set('progress:' + todayKey, progress);
  render();
}
async function r1Guess(){
  const inp = $('guess');
  const raw = inp.value.trim();
  if (!raw) return;
  const key = norm(raw);
  const name = LOOKUP[key];
  const fb = $('feedback');
  inp.value = ''; inp.focus();
  if (!name || name[0] !== puzzle.letter){
    fb.textContent = name ? ('"' + name + '" doesn\u2019t start with ' + puzzle.letter + '.') : ('"' + raw + '" isn\u2019t one of the 351.');
    fb.className = 'feedback bad'; inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake');
    return;
  }
  if (progress.r1.found.includes(name)){
    fb.textContent = name + ' \u2014 already got it.'; fb.className = 'feedback'; return;
  }
  progress.r1.found.push(name);
  if (lastFresh) lastFresh.setAttribute('class', 'town lit');
  els[name].setAttribute('class', 'town lit fresh');
  lastFresh = els[name];
  showCallout(name);
  fb.textContent = 'Lit.'; fb.className = 'feedback good';
  $('scoreline').textContent = progress.r1.found.length + ' / ' + byLetter[puzzle.letter].length;
  $('chips').insertAdjacentHTML('afterbegin', '<span class="chip">' + escapeHtml(name) + '</span>');
  await Store.set('progress:' + todayKey, progress);
  if (progress.r1.found.length === byLetter[puzzle.letter].length) endR1();
}
async function endR1(){
  if (progress.r1.complete) return;
  progress.r1.complete = true;
  progress.r1.pts = progress.r1.found.length * 10;
  r1sub = 'done';
  const missed = byLetter[puzzle.letter].filter(n => !progress.r1.found.includes(n));
  missed.forEach(n => els[n].setAttribute('class', 'town missed'));
  await Store.set('progress:' + todayKey, progress);
  phase = 'r1';
  render();
}

/* ---------- Round 2: name that town ---------- */
function renderR2(){
  showMap();
  resetMap();
  els[puzzle.town2].setAttribute('class', 'town target' + (progress.r2.done ? ' revealed' : ''));
  if (progress.r2.done){
    showCallout(puzzle.town2);
    const tier = progress.r2.correct
      ? (progress.r2.attempts === 1 ? { em: '\u{1F3AF}', label: 'First try!' } : progress.r2.attempts === 2 ? { em: '\u{1F525}', label: 'Second try' } : { em: '\u{1F44D}', label: 'Third try' })
      : { em: '\u{1F4A4}', label: 'Not this time' };
    $('panel').innerHTML =
      '<div class="card">' +
        '<div class="resultline"><span class="em">' + tier.em + '</span><span>' + tier.label + '</span><span class="pts">' + progress.r2.pts + ' pts</span></div>' +
        '<div class="answerbox">That\u2019s <b>' + escapeHtml(puzzle.town2) + '</b>.</div>' +
        '<button class="bigbtn" data-action="goto-r3">Continue to Round 3</button>' +
      '</div>';
    return;
  }
  const wrong = progress.r2.picks || [];
  const remaining = 3 - progress.r2.attempts;
  $('maplabel').innerHTML = 'What town is highlighted?';
  $('panel').innerHTML =
    '<div class="card">' +
      '<h2>Name that town</h2>' +
      '<div class="desc" id="r2desc">' + remaining + ' guess' + (remaining === 1 ? '' : 'es') + ' left.</div>' +
      '<div class="choices">' +
        r2Options.map(n =>
          '<button class="choice' + (wrong.indexOf(n) !== -1 ? ' wrong' : '') + '"' +
          (wrong.indexOf(n) !== -1 ? ' disabled' : '') +
          ' data-action="r2pick" data-town="' + escapeHtml(n) + '">' + escapeHtml(n) + '</button>'
        ).join('') +
      '</div>' +
    '</div>';
}
async function r2Pick(btn){
  if (progress.r2.done || btn.disabled) return;
  const name = btn.dataset.town;
  if (!progress.r2.picks) progress.r2.picks = [];
  if (progress.r2.picks.indexOf(name) !== -1) return;
  progress.r2.attempts++;
  if (name === puzzle.town2){
    progress.r2.correct = true;
    progress.r2.done = true;
    progress.r2.pts = progress.r2.attempts === 1 ? 100 : progress.r2.attempts === 2 ? 60 : 30;
    await Store.set('progress:' + todayKey, progress);
    render();
    return;
  }
  progress.r2.picks.push(name);
  if (progress.r2.attempts >= 3){
    progress.r2.correct = false;
    progress.r2.done = true;
    progress.r2.pts = 0;
    await Store.set('progress:' + todayKey, progress);
    render();
    return;
  }
  btn.classList.add('wrong');
  btn.disabled = true;
  const left = 3 - progress.r2.attempts;
  const d = $('r2desc');
  if (d) d.textContent = left + ' guess' + (left === 1 ? '' : 'es') + ' left.';
  await Store.set('progress:' + todayKey, progress);
}

/* ---------- Round 3: time machine ---------- */
function renderR3(){
  const q = TRIVIA[puzzle.triviaIdx];
  showTrivia(q.clue);
  if (progress.r3.done){
    const tier = yearTier(progress.r3.guess, q.year);
    $('panel').innerHTML =
      '<div class="card">' +
        '<div class="resultline"><span class="em">' + tier.em + '</span><span>' + tier.label + '</span><span class="pts">' + progress.r3.pts + ' pts</span></div>' +
        '<div class="answerbox">You guessed <b>' + progress.r3.guess + '</b>. It happened in <b>' + q.year + '</b>.</div>' +
        '<button class="bigbtn" data-action="goto-r4">Continue to Round 4</button>' +
      '</div>';
    return;
  }
  $('panel').innerHTML =
    '<div class="card">' +
      '<h2>Time Machine</h2>' +
      '<div style="font-size:17px; line-height:1.5; color:var(--text); font-weight:600; border-left:3px solid var(--target); padding-left:12px;">' + escapeHtml(q.clue) + '</div>' +
      '<div class="desc">What year did this happen? One guess.</div>' +
      '<div class="inputrow"><input type="number" inputmode="numeric" id="guess3" placeholder="e.g. 1897"><button class="go" data-action="r3submit">Lock in</button></div>' +
    '</div>';
  $('guess3').focus();
}
async function r3Guess(){
  const inp = $('guess3');
  const v = parseInt(inp.value, 10);
  if (!Number.isFinite(v)) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); return; }
  const q = TRIVIA[puzzle.triviaIdx];
  progress.r3.guess = v;
  progress.r3.done = true;
  progress.r3.pts = yearTier(v, q.year).pts;
  await Store.set('progress:' + todayKey, progress);
  render();
}

/* ---------- Round 4: distance ---------- */
function renderR4(){
  showMap();
  resetMap();
  if (puzzle.distMode === 'between'){
    els[puzzle.townA].setAttribute('class', 'town target' + (progress.r4.done ? ' revealed' : ''));
    els[puzzle.townB].setAttribute('class', 'town target' + (progress.r4.done ? ' revealed' : ''));
    if (progress.r4.done) showTwoCallouts(puzzle.townA, puzzle.townB);
    else $('maplabel').innerHTML = '<b>' + escapeHtml(puzzle.townA) + '</b> \u2194 <b>' + escapeHtml(puzzle.townB) + '</b>';
  } else {
    els[puzzle.perimTown].setAttribute('class', 'town target' + (progress.r4.done ? ' revealed' : ''));
    if (progress.r4.done) showCallout(puzzle.perimTown);
    else $('maplabel').innerHTML = '<b>' + escapeHtml(puzzle.perimTown) + '</b>';
  }
  const question = puzzle.distMode === 'between'
    ? 'How many miles apart are ' + puzzle.townA + ' and ' + puzzle.townB + ', center to center, as the crow flies?'
    : 'What\u2019s the perimeter of ' + puzzle.perimTown + '\u2019s border, in miles?';
  if (progress.r4.done){
    const tier = distTier(progress.r4.guess, distAnswer);
    $('panel').innerHTML =
      '<div class="card">' +
        '<div class="resultline"><span class="em">' + tier.em + '</span><span>' + tier.label + '</span><span class="pts">' + progress.r4.pts + ' pts</span></div>' +
        '<div class="answerbox">You guessed <b>' + progress.r4.guess + ' mi</b>. The answer is <b>' + Math.round(distAnswer * 10) / 10 + ' mi</b>.</div>' +
        '<button class="bigbtn" data-action="goto-summary">See today\u2019s results</button>' +
      '</div>';
    return;
  }
  $('panel').innerHTML =
    '<div class="card">' +
      '<h2>Distance</h2>' +
      '<div class="desc">' + escapeHtml(question) + '</div>' +
      '<div class="inputrow"><input type="number" inputmode="decimal" id="guess4" placeholder="miles"><button class="go" data-action="r4submit">Lock in</button></div>' +
    '</div>';
  $('guess4').focus();
}
async function r4Guess(){
  const inp = $('guess4');
  const v = parseFloat(inp.value);
  if (!Number.isFinite(v) || v < 0) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); return; }
  progress.r4.guess = v;
  progress.r4.done = true;
  progress.r4.pts = distTier(v, distAnswer).pts;
  await Store.set('progress:' + todayKey, progress);
  render();
}

/* ---------- Summary ---------- */
function tierGlyph(pts, max){
  const pct = pts / max;
  if (pct >= 0.95) return '\u{1F3AF}';
  if (pct >= 0.6) return '\u{1F525}';
  if (pct >= 0.25) return '\u{1F44D}';
  return '\u{1F4A4}';
}
async function renderSummary(){
  showMap(); resetMap();
  $('maplabel').innerHTML = dateLabel + ' complete.';
  const total = totalScore();
  const stats = await updateStats();
  $('panel').innerHTML =
    '<div class="card summary">' +
      '<h3>' + total + ' points</h3>' +
      '<div class="streak">\u{1F525} ' + stats.streak + '-day streak</div>' +
      '<div class="resultline"><span>\u{1F524} Letters</span><span class="pts">' + progress.r1.pts + '</span></div>' +
      '<div class="resultline"><span>\u{1F4CD} Name that town</span><span class="pts">' + progress.r2.pts + '</span></div>' +
      '<div class="resultline"><span>\u{1F4C5} Time Machine</span><span class="pts">' + progress.r3.pts + '</span></div>' +
      '<div class="resultline"><span>\u{1F4CF} Distance</span><span class="pts">' + progress.r4.pts + '</span></div>' +
      '<button class="sharebtn" data-action="share">Share score</button>' +
      '<div class="desc">New rounds tomorrow at midnight.</div>' +
    '</div>';
}
async function updateStats(){
  let stats = await Store.get('stats');
  if (!stats) stats = { streak: 0, lastDate: null, gamesPlayed: 0, bestScore: 0 };
  if (stats.lastDate !== todayKey){
    const y = new Date(today0); y.setDate(y.getDate() - 1);
    stats.streak = (stats.lastDate === localDateKey(y)) ? stats.streak + 1 : 1;
    stats.lastDate = todayKey;
    stats.gamesPlayed++;
    stats.bestScore = Math.max(stats.bestScore, totalScore());
    await Store.set('stats', stats);
  }
  return stats;
}
function buildShareText(withLink){
  const t2 = tierGlyph(progress.r2.pts, 100);
  const t3 = tierGlyph(progress.r3.pts, 100);
  const t4 = tierGlyph(progress.r4.pts, 100);
  const lines = [
    'THE 351 \u00B7 ' + dateLabel,
    '\u{1F524} ' + puzzle.letter + ': ' + progress.r1.found.length + ' towns (' + progress.r1.pts + ' pts)',
    '\u{1F4CD} Name that town: ' + t2 + ' (' + progress.r2.pts + ' pts)',
    '\u{1F4C5} Time Machine: ' + t3 + ' (' + progress.r3.pts + ' pts)',
    '\u{1F4CF} Distance: ' + t4 + ' (' + progress.r4.pts + ' pts)',
    'Total: ' + totalScore() + ' pts'
  ];
  if (withLink) lines.push('', 'Play today\u2019s rounds: ' + GAME_URL);
  return lines.join('\n');
}
function copyFallback(t){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  document.execCommand('copy'); ta.remove();
}
function openShare(){
  const full = buildShareText(true);
  $('scorecard').textContent = full;
  // sms: body syntax differs across platforms; "?&body=" works on both iOS and Android
  $('smsbtn').setAttribute('href', 'sms:?&body=' + encodeURIComponent(full));
  $('nativebtn').classList.toggle('hidden', !navigator.share);
  $('copybtn').textContent = 'Copy score + link';
  $('sharemodal').classList.remove('hidden');
}
function closeShare(){ $('sharemodal').classList.add('hidden'); }
async function copyShare(){
  const full = buildShareText(true);
  try { await navigator.clipboard.writeText(full); } catch(e){ copyFallback(full); }
  $('copybtn').textContent = 'Copied \u2014 paste it anywhere';
  setTimeout(() => { $('copybtn').textContent = 'Copy score + link'; }, 1800);
}
async function nativeShare(){
  const full = buildShareText(true);
  try { if (navigator.share) await navigator.share({ text: full }); }
  catch(e){ /* user cancelled */ }
}

/* ---------- init ---------- */
document.getElementById('daytag').innerHTML = '<b>' + dateLabel + '</b>';

document.getElementById('panel').addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;
  if (a === 'r1start') r1Start();
  else if (a === 'r1submit') r1Guess();
  else if (a === 'r1end') endR1();
  else if (a === 'goto-r2'){ phase = 'r2'; render(); }
  else if (a === 'r2pick') r2Pick(b);
  else if (a === 'goto-r3'){ phase = 'r3'; render(); }
  else if (a === 'r3submit') r3Guess();
  else if (a === 'goto-r4'){ phase = 'r4'; render(); }
  else if (a === 'r4submit') r4Guess();
  else if (a === 'goto-summary'){ phase = 'summary'; render(); }
  else if (a === 'share') openShare();
});
document.getElementById('panel').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'guess') r1Guess();
  else if (e.target.id === 'guess3') r3Guess();
  else if (e.target.id === 'guess4') r4Guess();
});
document.getElementById('closeshare').addEventListener('click', closeShare);
document.getElementById('copybtn').addEventListener('click', copyShare);
document.getElementById('nativebtn').addEventListener('click', nativeShare);
document.getElementById('sharemodal').addEventListener('click', e => {
  if (e.target.id === 'sharemodal') closeShare();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeShare();
});
document.getElementById('bannerbtn').addEventListener('click', () => location.reload());
setInterval(() => {
  if (localDateKey(new Date()) !== todayKey) document.getElementById('banner').classList.add('show');
}, 60000);

(async function init(){
  const saved = await Store.get('progress:' + todayKey);
  progress = (saved && saved.date === todayKey) ? saved : freshProgress();
  if (progress.r1.endsAt && !progress.r1.complete){
    if (Date.now() >= progress.r1.endsAt){
      progress.r1.complete = true;
      progress.r1.pts = progress.r1.found.length * 10;
      r1sub = 'done';
    } else {
      r1sub = 'active';
    }
  } else if (progress.r1.complete){
    r1sub = 'done';
  } else {
    r1sub = 'ready';
  }
  phase = currentPhaseFromProgress();
  render();
})();

</script>
</body>
